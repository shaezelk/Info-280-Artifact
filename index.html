<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaezel's Wheel of (Professional) Wisdom</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --card-bg: #ffffff;
      --border: #e6dfd3;
      --text-main: #33272b;
      --text-muted: #7d6b71;
      --pink-anchor: #f472b6;
      --pink-bridge: #fbcfe8;
      --pink-fade: #fdf2f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
    header { text-align: center; margin-bottom: 20px; max-width: 720px; }
    h1 { font-size: 1.6rem; letter-spacing: 0.04em; font-weight: 800; color: #831843; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; font-weight: 500; }

    .canvas-wrapper {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 50%;
      padding: 12px;
      box-shadow: 0 20px 40px -15px rgba(131, 24, 67, 0.08);
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg.radial-svg { width: 100%; height: auto; max-height: 720px; filter: drop-shadow(0 4px 12px rgba(131, 24, 67, 0.06)); }
    
    .piece-group { 
      cursor: pointer; 
      pointer-events: auto;
      transition: transform 0.2s ease, filter 0.2s ease; 
      transform-origin: 400px 400px; 
    }
    .piece-group:hover { 
      filter: brightness(1.05) drop-shadow(0 0 12px rgba(244, 114, 182, 0.45)); 
    }
    
    .wedge-path {
      cursor: pointer;
      pointer-events: auto;
    }

    .piece-group text {
      pointer-events: none;
      user-select: none;
    }

    .center-circle { 
      cursor: pointer; 
      pointer-events: auto;
      transition: transform 0.2s ease, filter 0.2s ease; 
      transform-origin: 400px 400px; 
    }
    .center-circle:hover { 
      transform: scale(1.02); 
      filter: drop-shadow(0 0 18px rgba(244, 114, 182, 0.5)); 
    }
    .center-circle text {
      pointer-events: none;
      user-select: none;
    }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(51, 39, 43, 0.45); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
      max-width: 530px; width: 100%; padding: 32px; position: relative; box-shadow: 0 25px 50px -12px rgba(131, 24, 67, 0.2);
    }
    .modal-close { position: absolute; top: 18px; right: 18px; background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: var(--text-main); }
    
    .modal-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; }
    .badge-main { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
    .badge-learn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-goal { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }

    .modal-title { font-size: 1.4rem; font-weight: 800; color: #831843; margin-bottom: 14px; }
    
    .section-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9d174d;
      margin-bottom: 6px;
    }

    .modal-definition {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #33272b;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border);
    }

    .action-box {
      background: #fdf2f8;
      border-left: 3.5px solid #f472b6;
      padding: 14px 16px;
      border-radius: 0 8px 8px 0;
    }
    .action-box-header {
      font-size: 0.8rem;
      font-weight: 800;
      color: #9d174d;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .action-box-content {
      font-size: 0.9rem;
      line-height: 1.55;
      color: #4a3b40;
    }
  </style>
</head>
<body>

  <header>
    <h1>Shaezel's Wheel of (Professional) Wisdom</h1>
    <p class="subtitle">Welcome to my wheel, click on each to learn a bit more about each skill and where I am currently at.</p>
  </header>

  <div class="canvas-wrapper">
    <svg class="radial-svg" viewBox="0 0 800 800" id="radialSvg">
      <defs>
        <filter id="glow-self" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <!-- Standardized 37.5° wedge with 2.5° uniform gap -->
        <path id="wedgePath" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" />
      </defs>

      <circle cx="400" cy="400" r="335" fill="none" stroke="#f1ece3" stroke-width="2" />
      <circle cx="400" cy="400" r="342" fill="none" stroke="#e6dfd3" stroke-width="1" stroke-dasharray="3 4" />

      <!-- 0: EDUCATOR (Top Anchor: 0°) -->
      <g class="piece-group" onclick="openPieceModal(0)">
        <path class="wedge-path" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#f472b6" stroke="#db2777" stroke-width="2" />
        <text x="400" y="180" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="800">EDUCATOR</text>
        <text x="400" y="202" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="8" font-weight="700">[ MAIN SKILL ]</text>
      </g>

      <!-- 1: CONTINUED LEARNING (+40°) -->
      <g class="piece-group" onclick="openPieceModal(1)">
        <path class="wedge-path" transform="rotate(40 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" />
        <text x="545" y="218" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="10" font-weight="800">CONTINUED</text>
        <text x="545" y="232" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="10" font-weight="800">LEARNING</text>
        <text x="545" y="252" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="7.5" font-weight="700">[ CURRENTLY LEARNING ]</text>
      </g>

      <!-- 2: MENTORSHIP (+80°) -->
      <g class="piece-group" onclick="openPieceModal(2)">
        <path class="wedge-path" transform="rotate(80 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2" />
        <text x="622" y="352" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="11.5" font-weight="800">MENTORSHIP</text>
        <text x="622" y="374" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="8" font-weight="700">[ FUTURE GOAL ]</text>
      </g>

      <!-- 3: COORDINATOR (Anchor: +120°) -->
      <g class="piece-group" onclick="openPieceModal(3)">
        <path class="wedge-path" transform="rotate(120 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#f472b6" stroke="#db2777" stroke-width="2" />
        <text x="595" y="500" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="800">COORDINATOR</text>
        <text x="595" y="522" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="8" font-weight="700">[ MAIN SKILL ]</text>
      </g>

      <!-- 4: OPTIMIZING WORKFLOWS (+160°) -->
      <g class="piece-group" onclick="openPieceModal(4)">
        <path class="wedge-path" transform="rotate(160 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" />
        <text x="478" y="608" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="10" font-weight="800">OPTIMIZING</text>
        <text x="478" y="624" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="10" font-weight="800">WORKFLOWS</text>
        <text x="478" y="646" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="7.5" font-weight="700">[ CURRENTLY LEARNING ]</text>
      </g>

      <!-- 5: RESTRUCTURING PROFESSIONALISM (+200°) -->
      <g class="piece-group" onclick="openPieceModal(5)">
        <path class="wedge-path" transform="rotate(200 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2" />
        <text x="322" y="608" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="9.5" font-weight="800">RESTRUCTURING</text>
        <text x="322" y="622" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="9" font-weight="800">PROFESSIONALISM</text>
        <text x="322" y="642" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="7.5" font-weight="700">[ FUTURE GOAL ]</text>
      </g>

      <!-- 6: BUILDER (Anchor: +240°) -->
      <g class="piece-group" onclick="openPieceModal(6)">
        <path class="wedge-path" transform="rotate(240 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#f472b6" stroke="#db2777" stroke-width="2" />
        <text x="205" y="500" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12" font-weight="800">BUILDER</text>
        <text x="205" y="522" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="8" font-weight="700">[ MAIN SKILL ]</text>
      </g>

      <!-- 7: RELATIONSHIPS & TEAMWORK (+280°) -->
      <g class="piece-group" onclick="openPieceModal(7)">
        <path class="wedge-path" transform="rotate(280 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#fbcfe8" stroke="#f472b6" stroke-width="2" />
        <text x="178" y="348" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="9.5" font-weight="800">RELATIONSHIPS &</text>
        <text x="178" y="364" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="9.5" font-weight="800">TEAMWORK</text>
        <text x="178" y="386" text-anchor="middle" dominant-baseline="central" fill="#831843" font-size="7.5" font-weight="700">[ CURRENTLY LEARNING ]</text>
      </g>

      <!-- 8: SPEAKING OUT (+320°) -->
      <g class="piece-group" onclick="openPieceModal(8)">
        <path class="wedge-path" transform="rotate(320 400 400)" d="M 359.50 280.20 L 295.60 92.50 A 325 325 0 0 1 504.40 92.50 L 440.50 280.20 A 126 126 0 0 0 359.50 280.20 Z" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2" />
        <text x="255" y="228" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="11.5" font-weight="800">SPEAKING OUT</text>
        <text x="255" y="250" text-anchor="middle" dominant-baseline="central" fill="#9d174d" font-size="8" font-weight="700">[ FUTURE GOAL ]</text>
      </g>

      <!-- Center Circle: Who am I -->
      <g class="center-circle" onclick="openSelfModal()">
        <circle cx="400" cy="400" r="110" fill="#ffffff" stroke="#f472b6" stroke-width="4.5" filter="url(#glow-self)" />
        <circle cx="400" cy="400" r="102" fill="none" stroke="#fdf2f8" stroke-width="2" />
        <text x="400" y="394" text-anchor="middle" fill="#831843" font-size="20" font-weight="900" letter-spacing="2">WHO AM I</text>
        <text x="400" y="416" text-anchor="middle" fill="#db2777" font-size="9" font-weight="700" letter-spacing="1">THE SELF</text>
      </g>
    </svg>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="mBadge" class="modal-badge">Status</div>
      <h2 class="modal-title" id="mTitle">Title</h2>
      
      <div class="section-label">Definition</div>
      <p class="modal-definition" id="mDefinition">Definition text</p>
      
      <div class="action-box">
        <div class="action-box-header" id="mActionHeader">Ways to grow this part</div>
        <div class="action-box-content" id="mActionContent">Action steps</div>
      </div>
    </div>
  </div>

  <script>
    const modalData = [
      // 0: Educator
      {
        title: "Educator",
        status: "Main Skill",
        badgeClass: "badge-main",
        definition: "Through all my tutoring work through my Job at Kumon, learned to teach, and be patient with people.",
        actionHeader: "Ways I've grown this skill",
        actionContent: "Repeated tutoring, working with students of all ages to help me understand different backgrounds and ways of learning."
      },
      // 1: Continued Learning
      {
        title: "Continued Learning",
        status: "Currently Learning",
        badgeClass: "badge-learn",
        definition: "Understanding that education can be an ongoing process. Restructuring the idea of professionalism to allow for people to continue growing and learning to develop themselves.",
        actionHeader: "Ways to reach this part",
        actionContent: "Take on challenging roles that might force me to expand my skill set and education. Continue learning both in technical settings and also from other people."
      },
      // 2: Mentorship
      {
        title: "Mentorship",
        status: "Future Goal",
        badgeClass: "badge-goal",
        definition: "Through combining my skills in education and coordinating, I can help people grow and learn new tasks. In terms of professionalism, this can be mentoring new hires/coworkers in the work we’re doing. I can translate complex concepts into simple, more easily understandable ideas.",
        actionHeader: "Ways to reach this part",
        actionContent: "Gain more mentorship roles through clubs or organizations. Help identify what I want to pass on and how to use my tutoring skills to coach someone."
      },
      // 3: Coordinator
      {
        title: "Coordinator",
        status: "Main Skill",
        badgeClass: "badge-main",
        definition: "Through my job as an event coordinator at Cascadia College, I learned a lot about planning and managing events. Handling all logistics and organization.",
        actionHeader: "Ways I've grown this part",
        actionContent: "Continued practice planning events, keeping my own personal life organized, helping manage teams in group settings."
      },
      // 4: Optimizing Workflows
      {
        title: "Optimizing Workflows",
        status: "Currently Learning",
        badgeClass: "badge-learn",
        definition: "Combining organizational skills to build something that can make work much easier, using tools to eliminate unnecessary work and optimize time.",
        actionHeader: "Ways to work on this part",
        actionContent: "Find redundant tasks and work with people to organize work into parts that can be replicated by AI or other tools."
      },
      // 5: Restructuring Professionalism
      {
        title: "Restructuring Professionalism",
        status: "Future Goal",
        badgeClass: "badge-goal",
        definition: "Rather than focusing on perfection, I want to focus on being authentic. Working with other people and building meaningful relationships rooted in trust, transparency, and vulnerability, that shows a partnership rather than competition.",
        actionHeader: "Ways to reach this part",
        actionContent: "Immersing myself in an environment that can be restructured, getting honest about my goals with people, leading by example and modeling what I want professionalism to look like."
      },
      // 6: Builder
      {
        title: "Builder",
        status: "Main Skill",
        badgeClass: "badge-main",
        definition: "Through my work at a corporate tech company, building actual deliverables for customers, working on scalable systems and designing tangible products.",
        actionHeader: "Ways I've grown this part",
        actionContent: "Practicing with random fun side projects, getting feedback from managers and coworkers, schoolwork, and other learning."
      },
      // 7: Relationships & Teamwork
      {
        title: "Relationships and Teamwork",
        status: "Currently Learning",
        badgeClass: "badge-learn",
        definition: "Building relationships that are open and inviting. Working to create psychologically safe spaces that foster a partnership relationship rather than a competitive type of relationship.",
        actionHeader: "Ways to work on this part",
        actionContent: "Working with other people, lots of group projects where you play different roles, understanding what you and your team needs."
      },
      // 8: Speaking Out
      {
        title: "Speaking Out",
        status: "Future Goal",
        badgeClass: "badge-goal",
        definition: "Gaining confidence to speak up and be expressive in places without fear of being wrong or judged. Being professional doesn't mean knowing everything right away.",
        actionHeader: "Ways to work on this part",
        actionContent: "Creating safer spaces, improving personal confidence, asking questions, getting to know the people you work with."
      }
    ];

    function openPieceModal(idx) {
      const item = modalData[idx];
      showModal(item.status, item.badgeClass, item.title, item.definition, item.actionHeader, item.actionContent);
    }

    function openSelfModal() {
      showModal(
        "Integrated Core",
        "badge-main",
        "The Self",
        "This piece is at the center of the whole wheel. This represents the professional definition of me that I am analyzing and exploring.",
        "Ways to grow this piece",
        "Continuously check in with yourself, be honest when evaluating your growth and what pillars are important to you; it's OK to change pillars as long as your overall image aligns with what you want to be."
      );
    }

    function showModal(badge, bClass, title, definition, actionHeader, actionContent) {
      document.getElementById('mBadge').textContent = badge;
      document.getElementById('mBadge').className = `modal-badge ${bClass}`;
      document.getElementById('mTitle').textContent = title;
      document.getElementById('mDefinition').textContent = definition;
      document.getElementById('mActionHeader').textContent = actionHeader;
      document.getElementById('mActionContent').textContent = actionContent;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
