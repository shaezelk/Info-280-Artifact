<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaezel's Wheel of (Professional) Wisdom</title>
  <style>
    :root {
      /* Warm Beige / Off-White Palette */
      --bg: #f7f4ee;
      --card-bg: #ffffff;
      --border: #e6dfd3;
      --text-main: #33272b;
      --text-muted: #7d6b71;
      
      /* Pastel Pink Spectrum */
      --pink-anchor: #f472b6;       /* Vibrant rose/pink anchor */
      --pink-anchor-border: #db2777;
      --pink-bridge: #fbcfe8;       /* Soft pastel pink */
      --pink-fade: #fdf2f8;         /* Pale blush cream */
      --self-core: #ffffff;
      --self-border: #f472b6;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    }

    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 24px 16px; 
    }

    header { 
      text-align: center; 
      margin-bottom: 24px; 
      max-width: 720px; 
    }

    h1 { 
      font-size: 1.6rem; 
      letter-spacing: 0.04em; 
      font-weight: 800; 
      color: #831843;
      margin-bottom: 8px; 
    }

    p.subtitle { 
      color: var(--text-muted); 
      font-size: 0.95rem; 
      line-height: 1.5; 
      font-weight: 500;
    }

    .canvas-wrapper {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 50%;
      padding: 12px;
      box-shadow: 0 20px 40px -15px rgba(131, 24, 67, 0.08), 0 0 0 1px rgba(230, 223, 211, 0.5);
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg.radial-svg { 
      width: 100%; 
      height: auto; 
      max-height: 720px; 
      filter: drop-shadow(0 4px 12px rgba(131, 24, 67, 0.06)); 
    }

    .piece-group { 
      cursor: pointer; 
      transition: transform 0.2s ease, filter 0.2s ease; 
      transform-origin: 400px 400px; 
    }

    .piece-group:hover { 
      filter: brightness(1.05) drop-shadow(0 0 12px rgba(244, 114, 182, 0.45)); 
    }
    
    .center-circle { 
      cursor: pointer; 
      transition: transform 0.2s ease, filter 0.2s ease; 
      transform-origin: 400px 400px;
    }

    .center-circle:hover { 
      transform: scale(1.02);
      filter: drop-shadow(0 0 18px rgba(244, 114, 182, 0.5)); 
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; 
      inset: 0; 
      background: rgba(51, 39, 43, 0.45); 
      backdrop-filter: blur(6px);
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 100; 
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 18px;
      max-width: 520px; 
      width: 100%; 
      padding: 32px; 
      position: relative; 
      box-shadow: 0 25px 50px -12px rgba(131, 24, 67, 0.2);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-close { 
      position: absolute; 
      top: 18px; 
      right: 18px; 
      background: none; 
      border: none; 
      color: var(--text-muted); 
      font-size: 1.4rem; 
      cursor: pointer; 
      line-height: 1;
    }
    .modal-close:hover { color: var(--text-main); }

    .modal-badge { 
      display: inline-block; 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-size: 0.72rem; 
      font-weight: 700; 
      letter-spacing: 0.04em;
      text-transform: uppercase; 
      margin-bottom: 12px; 
    }

    .badge-main { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
    .badge-learn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge-goal { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }

    .modal-title { 
      font-size: 1.35rem; 
      font-weight: 800; 
      color: #831843; 
      margin-bottom: 12px; 
    }

    .modal-body { 
      font-size: 0.95rem; 
      line-height: 1.6; 
      color: #4a3b40; 
      margin-bottom: 16px; 
    }

    .action-plan { 
      background: #fdf2f8; 
      border-left: 3px solid #f472b6; 
      padding: 12px 16px; 
      border-radius: 0 8px 8px 0; 
      font-size: 0.88rem; 
      color: #4a3b40; 
      margin-bottom: 16px; 
      line-height: 1.5;
    }

    .action-plan strong { 
      color: #9d174d; 
      display: block; 
      margin-bottom: 4px; 
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .modal-quote { 
      border-left: 3px solid #fbcfe8; 
      padding-left: 14px; 
      font-style: italic; 
      color: var(--text-muted); 
      font-size: 0.84rem; 
      line-height: 1.5;
    }
  </style>
</head>

    <p class="subtitle">Welcome to my wheel, click on each to learn a bit more about each skill and where I am currently at.</p>
  </header>
