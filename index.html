<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Relational Spectrum: Radial Assemblage</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141c2e;
      --border: #24324d;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --teal-main: #0d9488;
      --teal-light: #5eead4;
      --pale-white: #f8fafc;
      --amber: #f59e0b;
      --indigo: #6366f1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    header { text-align: center; margin-bottom: 16px; max-width: 650px; }
    h1 { font-size: 1.35rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 800; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 0.85rem; }

    .canvas-wrapper {
      background: #030712;
      border: 2px solid #1e293b;
      border-radius: 50%;
      padding: 10px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.85);
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg.radial-svg { width: 100%; height: auto; max-height: 720px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
    .piece-group { cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease; transform-origin: 400px 400px; }
    .piece-group:hover { filter: brightness(1.2) drop-shadow(0 0 12px rgba(94, 234, 212, 0.4)); }
    
    .center-circle { cursor: pointer; transition: filter 0.2s ease; }
    .center-circle:hover { filter: drop-shadow(0 0 20px rgba(255,255,255,0.9)); }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(4, 7, 14, 0.88); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    .modal-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
      max-width: 520px; width: 100%; padding: 28px; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9);
    }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
    .modal-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
    .badge-main { background: #0f766e; color: #ccfbf1; }
    .badge-learn { background: #854d0e; color: #fef08a; }
    .badge-goal { background: #3730a3; color: #e0e7ff; }

    .modal-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .modal-body { font-size: 0.92rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 14px; }
    .action-plan { background: rgba(255,255,255,0.04); border-left: 3px solid var(--teal-light); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.85rem; color: #e2e8f0; margin-bottom: 14px; }
    .action-plan strong { color: var(--teal-light); display: block; margin-bottom: 4px; }
    .modal-quote { border-left: 3px solid #6366f1; padding-left: 12px; font-style: italic; color: var(--text-muted); font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <h1>The Relational Spectrum</h1>
    <p class="subtitle">A radial assemblage of primary identities, bridging skills, and ongoing growth trajectory.</p>
  </header>

  <div class="canvas-wrapper">
    <svg class="radial-svg" viewBox="0 0 800 800" id="radialSvg">
      <defs>
        <filter id="glow-self" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <!-- Background Ring Track -->
      <circle cx="400" cy="400" r="340" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
      <g id="ringPieces"></g>
      <!-- Center Circle: Self -->
      <g class="center-circle" onclick="openModal(selfData)">
        <circle cx="400" cy="400" r="110" fill="#ffffff" stroke="#5eead4" stroke-width="4" filter="url(#glow-self)" />
        <text x="400" y="394" text-anchor="middle" fill="#090d16" font-size="20" font-weight="900" letter-spacing="3">SELF</text>
        <text x="400" y="416" text-anchor="middle" fill="#0f766e" font-size="9.5" font-weight="700" letter-spacing="1">INTEGRATED CORE</text>
      </g>
    </svg>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="mBadge" class="modal-badge">Status</div>
      <h2 class="modal-title" id="mTitle">Title</h2>
      <p class="modal-body" id="mBody">Description</p>
      <div class="action-plan" id="mPlan">
        <strong>Ways to Cultivate / Achieve:</strong>
        <span id="mPlanText">Concrete execution step.</span>
      </div>
      <div class="modal-quote" id="mQuote">Quote from statement</div>
    </div>
  </div>

  <script>
    const selfData = {
      title: "The Self (Richard Schwartz)",
      badge: "Integrated Hub",
      badgeClass: "badge-main",
      body: "The core hub where all parts unite. Grounded in No Bad Parts, the Self rejects isolating roles into rigid masks. It leads with clarity, calm presence, and genuine relationality across tutoring, logistics, and code.",
      plan: "Check in with internal parts before entering high-stakes spaces; notice when the perfectionist protector is taking the wheel and return to centered curiosity.",
      quote: "Embrace them as what makes an authentic Self."
    };

    const ringData = [
      // ANCHOR 1: TOP
      { id: 0, title: "Educator", status: "Main Skill", badgeClass: "badge-main", fill: "#0d9488", textFill: "#ffffff", desc: "Rooted in Kumon tutoring. Professionalism grounded in patience and reliability rather than intimidating authority.", plan: "Design learning spaces where making mistakes is treated as data rather than failure.", quote: "I had to be the reliable one... making sure they knew they could make mistakes." },
      
      // BRIDGE 1: EDU -> COORD
      { id: 1, title: "Mentorship", status: "Main Skill", badgeClass: "badge-main", fill: "#2dd4bf", textFill: "#042f2e", desc: "Translating dense, intimidating systems into approachable concepts in the spirit of mutual aid.", plan: "Proactively author onboarding documentation and host open troubleshooting sessions for peers.", quote: "When someone is lost... breaking it down into something manageable is natural for me." },
      { id: 2, title: "Continued Learning", status: "Currently Learning", badgeClass: "badge-learn", fill: "#f0fdfa", textFill: "#0f766e", desc: "Balancing student curiosity with academic structure. Recognizing that education is an ongoing, lifelong discipline.", plan: "Actively seek critical feedback on teaching approaches and explore accessible pedagogical frameworks.", quote: "Continuing my own education or mentoring others will continue to be a part of who I am." },
      
      // ANCHOR 2: BOTTOM-RIGHT
      { id: 3, title: "Coordinator", status: "Main Skill", badgeClass: "badge-main", fill: "#0d9488", textFill: "#ffffff", desc: "Cascadia event operations for 700+ attendees. Handling behind-the-scenes chaos without letting it bleed onto the community.", plan: "Maintain modular run-of-show schedules and build proactive communication buffers with stakeholders.", quote: "Managing all the chaos that comes with putting on events for almost 700-plus people." },
      
      // BRIDGE 2: COORD -> BUILD
      { id: 4, title: "Humane Tech Ops", status: "Currently Learning", badgeClass: "badge-learn", fill: "#2dd4bf", textFill: "#042f2e", desc: "Treating team workflows and sprint cadences with the same architectural rigor as production software.", plan: "Incorporate asynchronous check-ins and team bandwidth audits into sprint reviews.", quote: "Working collaboratively with other people to create something tangible, whether code or an event." },
      { id: 5, title: "Restructuring", status: "Future Goal", badgeClass: "badge-goal", fill: "#f0fdfa", textFill: "#0f766e", desc: "Unlearning the outdated corporate expectation of cold detachment and rigid, performative hierarchy.", plan: "Model vulnerability in team retrospectives; advocate for transparency over status-driven gatekeeping.", quote: "Right relationship means partnerships rooted in trust, transparency, and mutual support." },
      
      // ANCHOR 3: BOTTOM-LEFT
      { id: 6, title: "Builder", status: "Main Skill", badgeClass: "badge-main", fill: "#0d9488", textFill: "#ffffff", desc: "Corporate software engineering. Delivering customer-facing systems while resisting empty badge-and-standup posturing.", plan: "Focus on clean systems architecture and accessible code design that serves end users directly.", quote: "I was working in industry... on projects that reached actual customers." },
      
      // BRIDGE 3: BUILD -> EDU
      { id: 7, title: "Relational Teamwork", status: "Main Skill", badgeClass: "badge-main", fill: "#2dd4bf", textFill: "#042f2e", desc: "Collaborative problem-solving that prioritizes team well-being over individual posturing.", plan: "Normalize pairing on difficult bugs and openly crediting behind-the-scenes support work.", quote: "Working with other people to build relationships that boost the whole team." },
      { id: 8, title: "Speaking Out", status: "Future Goal", badgeClass: "badge-goal", fill: "#f0fdfa", textFill: "#0f766e", desc: "Overcoming the perfectionist hesitation to speak up in large rooms; unabashedly contributing ideas.", plan: "Commit to sharing one question or concept in the first 10 minutes of technical discussions.", quote: "Volunteer my ideas, rather than waiting and seeing if someone else will do so first." }
    ];

    // Build the 9 Wedge Segments with Jigsaw Notches
    const cx = 400, cy = 400;
    const rInner = 125, rOuter = 325;
    const N = 9;
    const angleStep = (2 * Math.PI) / N;

    const group = document.getElementById('ringPieces');

    ringData.forEach((d, i) => {
      // Offset start angle so Anchor 0 (Educator) sits directly at Top (-PI/2)
      const a0 = -Math.PI / 2 + i * angleStep - angleStep / 2;
      const a1 = a0 + angleStep;

      // Arc endpoints
      const p0 = { x: cx + rInner * Math.cos(a0), y: cy + rInner * Math.sin(a0) };
      const p1 = { x: cx + rOuter * Math.cos(a0), y: cy + rOuter * Math.sin(a0) };
      const p2 = { x: cx + rOuter * Math.cos(a1), y: cy + rOuter * Math.sin(a1) };
      const p3 = { x: cx + rInner * Math.cos(a1), y: cy + rInner * Math.sin(a1) };

      // Radial Jigsaw path with outer curved edge
      const pathData = `M ${p0.x} ${p0.y} L ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 0 0 ${p0.x} ${p0.y} Z`;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'piece-group');
      g.onclick = () => openModal(d);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('fill', d.fill);
      path.setAttribute('stroke', '#090d16');
      path.setAttribute('stroke-width', '2.5');

      // Label calculations at mid-angle
      const aMid = (a0 + a1) / 2;
      const rTextTitle = (rInner + rOuter) / 2 - 10;
      const rTextSub = (rInner + rOuter) / 2 + 16;

      const tTitle = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tTitle.setAttribute('x', cx + rTextTitle * Math.cos(aMid));
      tTitle.setAttribute('y', cy + rTextTitle * Math.sin(aMid));
      tTitle.setAttribute('text-anchor', 'middle');
      tTitle.setAttribute('dominant-baseline', 'central');
      tTitle.setAttribute('fill', d.textFill);
      tTitle.setAttribute('font-size', '11.5');
      tTitle.setAttribute('font-weight', '800');
      tTitle.setAttribute('letter-spacing', '0.5');
      tTitle.textContent = d.title.toUpperCase();

      const tSub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tSub.setAttribute('x', cx + rTextSub * Math.cos(aMid));
      tSub.setAttribute('y', cy + rTextSub * Math.sin(aMid));
      tSub.setAttribute('text-anchor', 'middle');
      tSub.setAttribute('dominant-baseline', 'central');
      tSub.setAttribute('fill', d.textFill);
      tSub.setAttribute('opacity', '0.85');
      tSub.setAttribute('font-size', '8.5');
      tSub.setAttribute('font-weight', '700');
      tSub.setAttribute('letter-spacing', '0.5');
      tSub.textContent = `[ ${d.status} ]`;

      g.appendChild(path);
      g.appendChild(tTitle);
      g.appendChild(tSub);
      group.appendChild(g);
    });

    function openModal(item) {
      document.getElementById('mBadge').textContent = item.status || item.badge;
      document.getElementById('mBadge').className = `modal-badge ${item.badgeClass}`;
      document.getElementById('mTitle').textContent = item.title;
      document.getElementById('mBody').textContent = item.desc || item.body;
      document.getElementById('mPlanText').textContent = item.plan;
      document.getElementById('mQuote').textContent = `"${item.quote}"`;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
