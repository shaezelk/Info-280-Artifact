<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Relational Assemblage: A 20-Piece Spectrum</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141c2e;
      --border: #24324d;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      
      /* Base Palettes */
      --amber: #f59e0b;
      --teal: #0d9488;
      --indigo: #6366f1;
      
      /* Gradients / Ombré */
      --grad-edu-build: linear-gradient(135deg, #f59e0b, #ec4899, #6366f1);
      --grad-edu-coord: linear-gradient(135deg, #f59e0b, #84cc16, #0d9488);
      --grad-coord-build: linear-gradient(135deg, #0d9488, #06b6d4, #6366f1);
      
      /* Krypt Glows */
      --self-glow: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 650px;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* 4 Rows x 5 Columns Rectangular Frame */
    .puzzle-container {
      background: #030712;
      border: 2px solid #1e293b;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      width: 100%;
      max-width: 950px;
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 115px);
      gap: 8px;
    }

    .piece {
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .piece:hover {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.15);
      z-index: 10;
      box-shadow: 0 12px 20px -4px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    }

    .piece-title {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .piece-desc {
      font-size: 0.65rem;
      opacity: 0.85;
      margin-top: 4px;
      line-height: 1.2;
    }

    /* Primary Zones */
    .zone-edu {
      background-color: var(--amber);
      color: #1a1001;
    }

    .zone-coord {
      background-color: var(--teal);
      color: #011f1c;
    }

    .zone-build {
      background-color: var(--indigo);
      color: #ffffff;
    }

    /* Ombré Overlap Zones */
    .zone-edu-build {
      background: var(--grad-edu-build);
      color: #ffffff;
    }

    .zone-edu-coord {
      background: var(--grad-edu-coord);
      color: #06201b;
    }

    .zone-coord-build {
      background: var(--grad-coord-build);
      color: #ffffff;
    }

    /* Center Self Core */
    .zone-self {
      background: #ffffff;
      color: #090d16;
      font-weight: 900;
      box-shadow: 0 0 25px var(--self-glow), inset 0 0 0 2px rgba(99, 102, 241, 0.4);
    }
    .zone-self .piece-title {
      font-size: 0.95rem;
      letter-spacing: 0.14em;
    }

    /* White / Border Tiles (Unwritten) */
    .zone-white {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px dashed #475569;
      color: var(--text-muted);
      box-shadow: none;
    }
    .zone-white:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #94a3b8;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 14, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 540px;
      width: 100%;
      padding: 32px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover { color: #fff; }

    .modal-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--amber);
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .modal-body {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 20px;
    }

    .modal-quote {
      border-left: 3px solid var(--indigo);
      padding-left: 14px;
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .puzzle-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto;
      }
      .piece { min-height: 90px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>The Relational Assemblage</h1>
    <p class="subtitle">An interlocking spectrum of internal roles, intersections, and space for becoming. Click any piece to inspect.</p>
  </header>

  <div class="puzzle-container">
    <div class="puzzle-grid" id="grid"></div>
  </div>

    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-tag" id="mTag">Domain</div>
      <h2 class="modal-title" id="mTitle">Title</h2>
      <p class="modal-body" id="mBody">Insight body text goes here.</p>
      <div
